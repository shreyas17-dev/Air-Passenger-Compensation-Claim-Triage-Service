apiVersion: 1
# Remove any earlier copy first so the fixed uid below always applies.
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus   # referenced by every panel in dashboard.json
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s   # matches the Prometheus scrape_interval

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Claim Triage</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#17212b;background:#f3f6f8}body{max-width:900px;margin:32px auto;padding:0 18px}header,section,.card{background:white;border:1px solid #d9e1e7;border-radius:12px;padding:20px;margin:14px 0}h1{margin:0;color:#0d3b56}label{display:block;font-weight:600;margin-top:10px}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #aab8c2;border-radius:6px;font:inherit}textarea{min-height:100px}button{margin-top:14px;padding:10px 16px;background:#0d6481;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}.muted{color:#5e6e78}.status{font-weight:700}.cite{border-left:3px solid #1684a5;padding:8px 12px;margin:8px 0;background:#f4fafc}.warn{background:#fff7df;padding:12px}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header><h1>Air Passenger Claim Triage</h1><p class="muted">Evidence-backed recommendation for officer review. This service does not authorise payment.</p></header>
<section><h2>Submit a claim</h2><form id="claim"><label>Disruption<select name="disruption"><option value="cancellation">Cancellation</option><option value="denied_boarding">Denied boarding</option><option value="delay">Delay</option><option value="downgrading">Downgrading</option></select></label><label>Flight number<input name="flight_number" value="AI101" required></label><label>Scheduled departure (ISO datetime)<input name="scheduled_departure" value="2026-10-30T12:00:00+05:30" required></label><label>Block time, minutes<input name="block_time_minutes" type="number" min="1" max="1800" value="120" required></label><label>Notice before departure, minutes (leave blank if unknown)<input name="notice_minutes" type="number" min="0" max="525600" value="90"></label><label>Booked one-way basic fare, INR (optional)<input name="booked_one_way_basic_fare_inr" type="number" min="0" step="0.01"></label><label>Airline fuel charge, INR (optional; enter together with fare)<input name="airline_fuel_charge_inr" type="number" min="0" step="0.01"></label><label>Alternate flight offered<select name="alternate_flight_provided"><option value="true">Yes</option><option value="false">No</option><option value="">Unknown</option></select></label><label>Passenger accepted alternate?<select name="alternate_accepted"><option value="true">Yes</option><option value="false">No</option><option value="">Unknown</option></select></label><label>Reported at airport?<select name="passenger_reported_at_airport"><option value="true">Yes</option><option value="false">No</option><option value="">Unknown</option></select></label><label>Contact details provided at booking?<select name="contact_details_provided"><option value="true">Yes</option><option value="false">No</option><option value="">Unknown</option></select></label><label>Cause attribution disputed?<select name="cause_disputed"><option value="false">No / not known to be disputed</option><option value="true">Yes</option></select></label><label>Disruption cause, if known<input name="cause" placeholder="e.g. operational issue"></label><label>Passenger's account<textarea name="free_text" required>My flight was cancelled. I was already at the airport and was told 90 minutes before departure. The airline put me on a flight four hours later, which I took. I want the compensation for cancellation.</textarea></label><button>Submit claim</button></form><p id="submission" class="status"></p></section>
<section id="resultPanel" class="hidden"><h2>Recommendation</h2><div id="result"></div></section><section><h2>Service metrics</h2><p id="metrics" class="muted">Loading…</p></section>
<script>
const form=document.querySelector('#claim'), out=document.querySelector('#submission');
const API='http://localhost:8000';
form.addEventListener('submit',async e=>{e.preventDefault();out.textContent='Submitting…';const f=new FormData(form), obj=Object.fromEntries(f.entries());for(const k of ['block_time_minutes','notice_minutes','booked_one_way_basic_fare_inr','airline_fuel_charge_inr'])obj[k]=obj[k]===''?null:Number(obj[k]);for(const k of ['alternate_flight_provided','alternate_accepted','passenger_reported_at_airport','contact_details_provided','cause_disputed'])obj[k]=obj[k]===''?null:obj[k]==='true';try{const r=await fetch(API+'/v1/claims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}),d=await r.json();if(!r.ok){out.textContent='Rejected: '+JSON.stringify(d.detail||d);return}out.textContent='Run '+d.run_id+' queued';poll(d.run_id)}catch(e){out.textContent='Service error: '+e}});
async function poll(id){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,1000));const d=await(await fetch(API+'/v1/runs/'+id)).json();out.textContent='Run '+id+': '+d.status;if(d.status==='completed'){show(d.result);return}if(d.status==='failed'){out.textContent+=' — '+d.error;return}}out.textContent+=' — Still processing; refresh later.'}
function show(r){document.querySelector('#resultPanel').classList.remove('hidden');document.querySelector('#result').innerHTML=`<p><strong>${esc(r.position.replaceAll('_',' '))}</strong></p><p>${esc(r.recommendation)}</p><p><strong>Basis:</strong> ${esc(r.basis)}</p><p><strong>Prompt version:</strong> ${esc(r.prompt_version)} · ${r.latency_ms} ms</p><h3>Retrieved citations</h3>${r.citations.map(c=>`<div class="cite"><b>${esc(c.source_id)} — §${esc(c.clause)}</b><p>${esc(c.quote)}</p><small><a href="${esc(c.source_url||'#')}" target="_blank" rel="noopener">${esc(c.source||'Source')} · page ${esc(c.page||'n/a')}</a></small></div>`).join('')||'<p>No supporting citation; escalated for review.</p>'}<div class="warn">${esc(r.authority_note)}</div><details><summary>Run trace</summary><pre id="trace">Loading…</pre></details><h3>Was this helpful?</h3><button onclick="sendFeedback('${r.run_id}',true)">Helpful</button> <button onclick="sendFeedback('${r.run_id}',false)">Not helpful</button><input id="reason" placeholder="Reason for feedback">` ;fetch(API+'/v1/runs/'+r.run_id+'/trace').then(x=>x.json()).then(x=>document.querySelector('#trace').textContent=JSON.stringify(x,null,2))}
async function sendFeedback(id,s){const reason=document.querySelector('#reason').value|| (s?'Helpful':'Needs review');await fetch(`${API}/v1/runs/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({satisfactory:s,reason})});alert('Feedback saved')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function metrics(){try{const x=await(await fetch(API+'/metrics')).text();document.querySelector('#metrics').textContent=x}catch{document.querySelector('#metrics').textContent='Metrics unavailable'}}metrics();setInterval(metrics,5000)
</script></body></html>
